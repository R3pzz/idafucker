<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>WebView2 RPC Demo</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background: #f7f7f7;
            padding: 2rem;
            -webkit-user-select: none;
            -moz-user-select: -moz-none;
            -ms-user-select: none;
            user-select: none;
        }

        .card {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: 0 auto;
        }

        input, button {
            padding: 0.6rem;
            margin-top: 0.5rem;
            margin-bottom: 1rem;
            width: 100%;
            border-radius: 8px;
            border: 3px solid #ccc;
            font-size: 1rem;
        }

        button {
            background: #0078d4;
            color: white;
            border: none;
            cursor: pointer;
        }

            button:hover {
                background: #005fa3;
            }

        #result {
            margin-top: 1rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>RPC Demo UI</h2>

        <label>Number A:</label>
        <input type="number" id="inputA" value="3" />

        <label>Number B:</label>
        <input type="number" id="inputB" value="4" />

        <button id="callNativeBtn">Call Native add(a, b)</button>
        <button id="callJSBtn">Call JS multiply(a, b)</button>

        <div id="result">Result: (waiting)</div>
    </div>

    <script>
    // Define a JS function that native can call
    window.multiply = function(a, b) {
      return a * b;
    };

    document.getElementById('callNativeBtn').addEventListener('click', async () => {
      const a = parseFloat(document.getElementById('inputA').value);
      const b = parseFloat(document.getElementById('inputB').value);
      try {
        const result = await window.nativeBridge.add(a, b);
        document.getElementById('result').innerText = `Result from native: ${result}`;
      } catch (err) {
        document.getElementById('result').innerText = `Error: ${err}`;
      }
    });

    document.getElementById('callJSBtn').addEventListener('click', () => {
      const a = parseFloat(document.getElementById('inputA').value);
      const b = parseFloat(document.getElementById('inputB').value);
      const result = window.multiply(a, b);
      document.getElementById('result').innerText = `Result from JS: ${result}`;
    });
    </script>
</body>
</html>
