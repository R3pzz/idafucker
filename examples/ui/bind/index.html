<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>WebView2 RPC Demo</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background: #f7f7f7;
            padding: 2rem;
            -webkit-user-select: none;
            -moz-user-select: -moz-none;
            -ms-user-select: none;
            user-select: none;
        }

        .card {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: 0 auto;
        }

        input, button {
            padding: 0.6rem;
            margin-top: 0.5rem;
            margin-bottom: 1rem;
            width: 100%;
            border-radius: 8px;
            border: 3px solid #ccc;
            font-size: 1rem;
        }

        button {
            background: #0078d4;
            color: white;
            border: none;
            cursor: pointer;
        }

            button:hover {
                background: #005fa3;
            }

        #result {
            margin-top: 1rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>RPC Demo UI</h2>

        <label>Process name to attach to:</label>
        <input id="inputA" value="chrome.exe" />

        <button id="attachToProcess">Attach to process</button>

        <div id="result">Result: (waiting)</div>
    </div>

    <script>
    document.getElementById('callNativeBtn').addEventListener('click', async () => {
      const processName = document.getElementById('inputA').value;
      try {
        const result = await window.nativeBridge.attachToProcess(processName);
        document.getElementById('result').innerText = `Result: ${result}`;
      } catch (err) {
        document.getElementById('result').innerText = `Error: ${err}`;
      }
    });
    </script>
</body>
</html>
